version: '3.8'

services:
  minio:
    image: minio/minio:latest
    container_name: minio_server
    ports:
      - "9000:9000" # Port cho API (ứng dụng kết nối vào)
      - "9001:9001" # Port cho Web Console (bạn vào trình duyệt xem giao diện)
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: always

volumes:
  minio_data:
